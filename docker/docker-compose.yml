version: '3.9'

services:
  # Application DevOps Hub Pro
  app:
    image: madike10/devops-hub:v2
    container_name: devops-hub-app
    ports:
      - "3000:3000"
    # environment:
    #   - NODE_ENV=${NODE_ENV:-development}
    #   - VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY}
    #   - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Development mode: Hot reload
      - ../app:/app/app
      - ../app/node_modules:/app/node_modules
      - app-cache:/app/.vite
    networks:
      - devops-hub-network
    # depends_on:
    #   - nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Reverse proxy & Static files
  # nginx:
  #   image: nginx:alpine
  #   container_name: devops-hub-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   networks:
  #     - devops-hub-network
  #   depends_on:
  #     - app
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s

networks:
  devops-hub-network:
    driver: bridge
volumes:
  app-cache:
    driver: local
    